<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f7f4" />
  <title>Collabstr — Creator marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#discover"><span class="brand-mark">c</span><span>collabstr</span></a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="discover"><span class="nav-icon">⌕</span> Discover creators</button>
        <button class="nav-item" data-view="campaigns"><span class="nav-icon">▤</span> Campaigns</button>
        <button class="nav-item" data-view="partnerships"><span class="nav-icon">↗</span> Partnerships</button>
        <button class="nav-item" data-view="profile"><span class="nav-icon">◉</span> My profile</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><span class="help-icon">✳</span><strong>Need a hand?</strong><p>Our team can help you find the right fit.</p><a href="mailto:hello@collabstr.com">Talk to us <span>↗</span></a></div>
        <button class="account" id="account-button"><span class="avatar" id="avatar">G</span><span class="account-info"><strong id="account-name">Guest</strong><small id="account-role">Brand workspace</small></span><span class="dots">···</span></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb"><span>Workspace</span><b>/</b><strong id="crumb">Discover creators</strong></div><div class="top-actions"><span class="live-dot"></span><span class="connected-label">Marketplace live</span><button class="icon-button" aria-label="Notifications">♧</button><button class="button button-dark top-cta" id="top-cta">Create campaign <span>＋</span></button></div></header>
      <div id="page" class="page"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="auth-dialog" class="dialog"><form method="dialog" class="dialog-close"><button aria-label="Close">×</button></form><div id="auth-content"></div></dialog>
  <dialog id="campaign-dialog" class="dialog dialog-wide"><form method="dialog" class="dialog-close"><button aria-label="Close">×</button></form><div id="campaign-content"></div></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
